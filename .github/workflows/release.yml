name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            asset: sito-macos-arm64
          - runner: macos-15-intel
            asset: sito-macos-x64
          - runner: ubuntu-latest
            asset: sito-linux-x64
          - runner: ubuntu-24.04-arm
            asset: sito-linux-arm64
          - runner: windows-latest
            asset: sito-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart compile exe bin/sito.dart -o ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes sito-*
        env:
          GH_TOKEN: ${{ github.token }}
